  <!-- Estilos dedicados: Logo Senac, Preloader, Coluna Fixa (.tn) e Semáforo (.sem) -->
  <style>
    /* Contraste automático da logo oficial do Senac */
    .senac-logo {
      filter: brightness(0);
    }
    @media (prefers-color-scheme: dark) {
      .senac-logo {
        filter: brightness(0) invert(1);
      }
    }

    /* Overlay do Preloader minimalista */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #ffffff;
      color: #0f172a;
      transition: opacity 0.4s ease;
    }
    @media (prefers-color-scheme: dark) {
      #preloader {
        background-color: #0f172a;
        color: #f1f5f9;
      }
    }
    #preloader.hide {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes preloadProgress {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
    .preload-fill {
      transform-origin: left center;
      animation: preloadProgress 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Coluna fixa de turnos sempre à frente dos cards ao rolar horizontalmente */
    .grade th.tn,
    .grade td.tn {
      position: sticky;
      left: 0;
      z-index: 10;
      border-right: 1px solid #e2e8f0;
      box-shadow: 2px 0 6px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      .grade th.tn,
      .grade td.tn {
        border-right-color: #1e293b;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.45);
      }
    }

    /* Cards abaixo da coluna fixa (.tn = z-index: 10) */
    .ev {
      position: relative;
      z-index: 1;
    }

    /* Semáforo: bolinha limpa sem "?" que expande em pílula na própria cor ao hover */
    .sem {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      line-height: 14px;
      text-align: center;
      cursor: default;
      transition: all 0.16s ease;
    }
    .sem::after {
      content: attr(data-tip);
      display: none;
      padding: 0 6px;
    }
    .sem:hover {
      width: auto;
      min-width: 12px;
      height: auto;
      padding: 2px 6px;
      border-radius: 999px;
      border-width: 0;
      z-index: 3;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .sem:hover::after {
      display: inline;
    }
    .sem.verde { background-color: #12b76a; color: #ffffff; }
    .sem.amarelo { background-color: #f5a524; color: #1d2330; }
    .sem.vermelho { background-color: #d92d20; color: #ffffff; }
    .sem.cinza { background-color: #667085; color: #ffffff; }
  </style>
</head>

  <!-- Script independente anti-travamento -->
  <script>
    (function () {
      var el = document.getElementById('preloader');
      if (!el) return;
      var fechado = false;
      function fechar() {
        if (fechado) return;
        fechado = true;
        el.classList.add('hide');
        setTimeout(function () {
          el.style.display = 'none';
        }, 400);
      }
      el.addEventListener('click', fechar);
      setTimeout(fechar, 2200);
    })();
  </script>

    const BLOCOS_TURNO = {

    };

    const CTH_AMB = [

      { id: 's2',  nome: 'Sala 02',          tipo: 'Sala',        cap: 30, externa: false },

    ];

    const CTH_TURMAS = [
      { id: '2026.4.82',  nome: 'Cozinheiro',                      seg: 'Gastronomia',           ch: 500,  periodo: '30/06/2026 a 07/01/2027', ini: '08:00', fim: '12:00', sig: 16, real: null, sala: 'lc1', doc: '', mod: '' },

    function estadoInicialUnidade(unitId) {
      if (unitId === 'cth') {
        return {
          temSabado: false,
          AMB: CTH_AMB.map(a => ({ ...a })),
          turmas: CTH_TURMAS.map(t => ({ origem: 'relatorio', dias: 'sem', oculta: null, saiu: null, ...t })),
          docentes: [],

      return {

        ],
        turmas: [],
        docentes: [],
        historico: [],
        importacoes: []
      };
    }

    function normalizarEstado(d) {
      const base = d && typeof d === 'object' ? d : {};
      return {
        temSabado: Boolean(base.temSabado),
        AMB: Array.isArray(base.AMB)
          ? base.AMB.map(a => ({
              id: String(a.id || ('a' + Date.now())),
              nome: String(a.nome || 'Ambiente'),
              tipo: String(a.tipo || 'Sala'),
              cap: Number(a.cap) || 0,
              externa: Boolean(a.externa)
            }))
          : [],
        turmas: Array.isArray(base.turmas)
          ? base.turmas.map(t => ({
              origem: t.origem || 'relatorio',
              dias: t.dias || 'sem',
              oculta: t.oculta ?? null,
              saiu: t.saiu ?? null,
              id: String(t.id || ''),
              nome: String(t.nome || ''),
              seg: String(t.seg || '—'),
              ch: Number(t.ch) || 0,
              periodo: String(t.periodo || ''),
              ini: String(t.ini || '08:00'),
              fim: String(t.fim || '12:00'),
              sig: Number(t.sig) || 0,
              real: (t.real === null || t.real === undefined || t.real === '') ? null : Number(t.real),
              sala: t.sala || null,
              doc: String(t.doc || ''),
              mod: String(t.mod || '')
            }))
          : [],
        docentes: Array.isArray(base.docentes) ? base.docentes.map(String) : [],
        historico: Array.isArray(base.historico) ? [...base.historico] : [],
        importacoes: Array.isArray(base.importacoes) ? [...base.importacoes] : []
      };
    }

    /* =========================================================================
     * ESTADO EM MEMÓRIA
     * ========================================================================= */
    let unidades = [];
    let unidadeAtual = 'cth';
    let temSabado = false;
    let AMB = [];
    let turmas = [];
    let docentes = [];
    let historico = [];
    let importacoes = [];
    let preview = null;
    let aba = 'mapa';
    let docEditIdx = null;

    let mapaEscopo = 'unidade';  // 'unidade' | 'externa'
    let mapaBusca = '';
    let mapaFiltro = 'todas';    // 'todas' | 'conflito' | 'sem_docente' | 'encerrando'
    let turmasBusca = '';
    let turmasFiltro = 'todas';  // 'todas' | 'pendencia' | 'conflito' | 'sem_docente'

    /* =========================================================================
     * UTILITÁRIOS PUROS
     * ========================================================================= */
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

    const norm = s => String(s ?? '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();

    const hm = s => {
      if (!s || !String(s).includes(':')) return 0;
      const [h, m] = String(s).split(':').map(Number);
      return (h || 0) + (m || 0) / 60;
    };

    function hojeSemHora() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    const ehTurmaSabado = t => (t.dias === 'sab' || t.dias === 'sabado');

    function turnoPrincipal(t) {
      if (ehTurmaSabado(t)) return 'Sábado';
      const h = hm(t.ini);
      return h < 12 ? 'Manhã' : h < 18 ? 'Tarde' : 'Noite';
    }

    function turnosDaTurma(t) {
      if (ehTurmaSabado(t)) return ['Sábado'];
      const ini = hm(t.ini);
      const fim = hm(t.fim);
      if (fim <= ini) return [turnoPrincipal(t)];
      const lista = TURNOS.filter(tn => {
        const [bIni, bFim] = BLOCOS_TURNO[tn];
        return ini < bFim && fim > bIni;
      });
      return lista.length ? lista : [turnoPrincipal(t)];
    }

    function turnosVisiveisMapa() {
      const existeSab = ativas().some(ehTurmaSabado);
      return (temSabado || existeSab) ? [...TURNOS, 'Sábado'] : TURNOS;
    }

    function toggleSabado(ativo) {
      temSabado = Boolean(ativo);
      save();
      render();
      toast(temSabado ? 'Turno Sábado ativado nesta unidade.' : 'Turno Sábado ocultado nesta unidade.', 'info');
    }

    const sobrepoe = (a, b) => hm(a.ini) < hm(b.fim) && hm(b.ini) < hm(a.fim);

    const dataPt = s => {
      const partes = String(s || '').trim().split('/').map(Number);
      if (partes.length !== 3 || partes.some(isNaN)) return hojeSemHora();
      return new Date(partes[2], partes[1] - 1, partes[0]);
    };

    const periodoDe = t => {
      const partes = String(t.periodo || '').split(' a ');
      if (partes.length < 2) {
        const h = hojeSemHora();
        return [h, h];
      }
      return [dataPt(partes[0]), dataPt(partes[1])];
    };

    const modLabel = t => t.mod || 'Não definida';
    const ativas = () => turmas.filter(t => !t.oculta);
    const ambNome = id => AMB.find(a => a.id === id)?.nome || '—';
    const agoraIso = () => new Date().toISOString();
    const agoraTxt = () => new Date().toLocaleString('pt-BR');
    const hojeTxt = () => new Date().toLocaleDateString('pt-BR');
    const fmtV = (campo, v) => {
      if (campo === 'sala') return v ? ambNome(v) : '—';
      if (campo === 'dias') return (v === 'sab' || v === 'sabado') ? 'Sábado' : 'Seg a Sex';
      return (v === null || v === undefined || v === '') ? '—' : String(v);
    };

    /* =========================================================================
     * REGRAS DE NEGÓCIO
     * ========================================================================= */
    function registrar(t, campo, de, para, origem) {
      historico.unshift({
        quando: agoraTxt(),
        iso: agoraIso(),
        turma: t.id,
        nome: t.nome,
        campo,
        de: de === undefined ? null : de,
        para: para === undefined ? null : para,
        origem
      });
      if (historico.length > 500) historico.length = 500;
    }

    function semaforo(t) {
      const hoje = hojeSemHora();
      const [ini, fim] = periodoDe(t);
      if (fim < hoje) return { cls: 'vermelho', txt: 'Encerrado', encerrando: false };
      if (ini > hoje) return { cls: 'cinza', txt: 'Não iniciado', encerrando: false };
      const dias = Math.round((fim - hoje) / 86400000);
      if (dias <= 30) {
        return { cls: 'amarelo', txt: `${dias} dia(s) para terminar`, encerrando: true };
      }
      return { cls: 'verde', txt: `${dias} dias para terminar`, encerrando: false };
    }

    function conflitos(t) {
      if (!t.sala && !t.doc) return [];
      const sabT = ehTurmaSabado(t);
      return ativas().filter(o => o !== t && ehTurmaSabado(o) === sabT && sobrepoe(t, o) && (
        (t.sala && o.sala === t.sala) || (t.doc && o.doc === t.doc)
      ));
    }

    function pendencias(t) {
      const p = [];
      if (!t.sala) p.push('a alocar (sem ambiente)');
      if (!t.mod) p.push('modalidade não definida');
      if (!t.doc) p.push('sem docente');
      if (conflitos(t).length) p.push('conflito de horário');
      const cap = AMB.find(a => a.id === t.sala)?.cap;
      if (cap && t.sig > cap) p.push('acima da capacidade da sala');
      if (t.saiu) p.push('saiu do relatório');
      return p;
    }

    /* =========================================================================
     * PERSISTÊNCIA HÍBRIDA (LOCALSTORAGE + FIREBASE FIRESTORE)
     * ========================================================================= */
    function atualizarSeloSync(status) {
      const el = document.getElementById('sync-badge');
      if (!el) return;
      if (!FIREBASE_ATIVO) {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Modo local`;
        el.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60';
        return;
      }
      if (status === 'syncing') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>Firebase · Sincronizando...`;
        el.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-sky-50 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300 border border-sky-200 dark:border-sky-800/60';
      } else if (status === 'permission') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>Firebase · Sem permissão`;
        el.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60';
      } else if (status === 'error') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>Firebase · Offline`;
        el.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60';
      } else {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Firebase · Online`;
        el.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60';
      }
    }

    function carregarListaUnidades() {
      try {
        const raw = localStorage.getItem(STORAGE_UNITS_KEY);
        unidades = raw ? JSON.parse(raw) : UNIDADES_PADRAO.map(u => ({ ...u }));
        if (!Array.isArray(unidades) || !unidades.length) {
          unidades = UNIDADES_PADRAO.map(u => ({ ...u }));
        }
      } catch (e) {
        unidades = UNIDADES_PADRAO.map(u => ({ ...u }));
      }
      try {
        const savedActive = localStorage.getItem(STORAGE_ACTIVE_UNIT);
        unidadeAtual = (savedActive && unidades.some(u => u.id === savedActive)) ? savedActive : unidades[0].id;
      } catch (e) {
        unidadeAtual = unidades[0].id;
      }
      renderSelectUnidades();

      if (FIREBASE_ATIVO) {
        if (typeof unsubMeta === 'function') {
          unsubMeta();
          unsubMeta = null;
        }
        unsubMeta = db.collection(FIRESTORE_COLECAO).doc('_meta').onSnapshot(
          snap => {
            if (snap.exists) {
              const data = snap.data();
              if (Array.isArray(data?.unidades) && data.unidades.length) {
                unidades = data.unidades.map(u => ({ id: String(u.id), nome: String(u.nome) }));
                try { localStorage.setItem(STORAGE_UNITS_KEY, JSON.stringify(unidades)); } catch (e) {}
                if (!unidades.some(u => u.id === unidadeAtual)) {
                  unidadeAtual = unidades[0].id;
                }
                renderSelectUnidades();
              }
            } else {
              salvarListaUnidades();
            }
          },
          err => {
            console.error('Erro Firestore _meta onSnapshot:', err);
            if (err && err.code === 'permission-denied') {
              atualizarSeloSync('permission');
            }
          }
        );
      }
    }

    function salvarListaUnidades() {
      try {
        localStorage.setItem(STORAGE_UNITS_KEY, JSON.stringify(unidades));
      } catch (e) {}

      if (FIREBASE_ATIVO) {
        return db.collection(FIRESTORE_COLECAO).doc('_meta').set({
          unidades: JSON.parse(JSON.stringify(unidades.map(u => ({ id: u.id, nome: u.nome })))),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => {
          console.error('Erro ao salvar _meta no Firestore:', err);
          if (err && err.code === 'permission-denied') {
            atualizarSeloSync('permission');
          }
          throw err;
        });
      }
      return Promise.resolve();
    }

    function renderSelectUnidades() {
      const sel = document.getElementById('unit-select');
      if (!sel) return;
      sel.innerHTML = unidades
        .map(u => `<option value="${esc(u.id)}" ${u.id === unidadeAtual ? 'selected' : ''}>${esc(u.nome)}</option>`)
        .join('');
    }

    function aplicarEstado(d) {
      const n = normalizarEstado(d);
      temSabado = n.temSabado;
      AMB = n.AMB;
      turmas = n.turmas;
      docentes = n.docentes;
      historico = n.historico;
      importacoes = n.importacoes;
    }

    function snapshotEstado() {
      return { temSabado, turmas, AMB, docentes, historico, importacoes };
    }

    function loadUnidade(unitId) {
      if (typeof unsubUnidade === 'function') {
        unsubUnidade();
        unsubUnidade = null;
      }

      let localData = null;
      try {
        const raw = localStorage.getItem(STORAGE_PREFIX + unitId);
        if (raw) localData = JSON.parse(raw);
      } catch (e) {}

      aplicarEstado(localData || estadoInicialUnidade(unitId));
      ultimoPayloadSalvo = JSON.stringify(snapshotEstado());
      preview = null;
      docEditIdx = null;
      render();

      if (FIREBASE_ATIVO) {
        atualizarSeloSync('syncing');
        unsubUnidade = db.collection(FIRESTORE_COLECAO).doc(unitId).onSnapshot(
          snap => {
            if (snap.exists) {
              const docData = snap.data();
              const remoto = normalizarEstado(docData?.dados || docData);
              const strRemoto = JSON.stringify(remoto);
              if (strRemoto !== ultimoPayloadSalvo) {
                aplicarEstado(remoto);
                ultimoPayloadSalvo = strRemoto;
                try { localStorage.setItem(STORAGE_PREFIX + unitId, strRemoto); } catch (e) {}
                render();
              }
            }
            atualizarSeloSync('online');
          },
          err => {
            console.error('Erro Firestore onSnapshot:', err);
            atualizarSeloSync(err && err.code === 'permission-denied' ? 'permission' : 'error');
          }
        );
      } else {
        atualizarSeloSync('local');
      }
    }

    function save() {
      const clean = normalizarEstado(snapshotEstado());
      const str = JSON.stringify(clean);
      ultimoPayloadSalvo = str;
      try {
        localStorage.setItem(STORAGE_PREFIX + unidadeAtual, str);
      } catch (e) {}

      if (FIREBASE_ATIVO) {
        atualizarSeloSync('syncing');
        const payloadLimpo = JSON.parse(str);
        db.collection(FIRESTORE_COLECAO).doc(unidadeAtual).set({
          unidade: unidadeAtual,
          dados: payloadLimpo,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).then(() => {
          atualizarSeloSync('online');
        }).catch(err => {
          console.error('Erro ao gravar no Firestore:', err);
          if (err && err.code === 'permission-denied') {
            atualizarSeloSync('permission');
            toast('Salvo localmente, mas o Firebase bloqueou a gravação (permission-denied). Verifique a aba Regras no Firestore.', 'err');
          } else {
            atualizarSeloSync('error');
          }
        });
      }
    }

    function trocarUnidade(unitId) {
      unidadeAtual = unitId;
      try { localStorage.setItem(STORAGE_ACTIVE_UNIT, unitId); } catch (e) {}
      mapaBusca = '';
      mapaFiltro = 'todas';
      turmasBusca = '';
      turmasFiltro = 'todas';
      loadUnidade(unitId);
    }

    /* =========================================================================
     * EXPORTAR / IMPORTAR BACKUP JSON (COM SEPARAÇÃO DE TRY/CATCH PARA FIRESTORE)
     * ========================================================================= */
    function exportarJSON() {
      const estados = {};
      unidades.forEach(u => {
        if (u.id === unidadeAtual) {
          estados[u.id] = normalizarEstado(snapshotEstado());
        } else {
          try {
            const raw = localStorage.getItem(STORAGE_PREFIX + u.id);
            estados[u.id] = normalizarEstado(raw ? JSON.parse(raw) : estadoInicialUnidade(u.id));
          } catch (e) {
            estados[u.id] = estadoInicialUnidade(u.id);
          }
        }
      });

      const payload = {
        versao: 3,
        tipo: 'multi-unidade',
        exportadoEm: agoraIso(),
        unidadeAtiva: unidadeAtual,
        unidades: unidades.map(u => ({ id: u.id, nome: u.nome })),
        estados
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gestao-pedagogica-senac-am-completo-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast('Backup completo (todas as unidades) exportado em JSON.', 'ok');
    }

    function importarJSON(inputEl) {
      const file = inputEl && inputEl.files ? inputEl.files[0] : null;
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        // 1) BLOCO EXCLUSIVO PARA LEITURA E VALIDAÇÃO DO JSON
        let d = null;
        try {
          d = JSON.parse(e.target.result);
        } catch (parseErr) {
          console.error('Erro de parse JSON:', parseErr);
          toast('Arquivo JSON inválido. Use um backup exportado por este sistema.', 'err');
          if (inputEl) inputEl.value = '';
          return;
        }

        const ehMulti = Boolean(d && typeof d === 'object' && d.tipo === 'multi-unidade' && d.estados && typeof d.estados === 'object');
        const ehLegado = Boolean(d && typeof d === 'object' && (Array.isArray(d.turmas) || Array.isArray(d.AMB)));

        if (!ehMulti && !ehLegado) {
          toast('Arquivo JSON inválido. Use um backup exportado por este sistema.', 'err');
          if (inputEl) inputEl.value = '';
          return;
        }

        // 2) APLICAÇÃO IMEDIATA NO LOCALSTORAGE E NA TELA
        const estadosParaNuvem = {};
        if (ehMulti) {
          if (Array.isArray(d.unidades) && d.unidades.length) {
            unidades = d.unidades.map(u => ({ id: String(u.id), nome: String(u.nome) }));
            try { localStorage.setItem(STORAGE_UNITS_KEY, JSON.stringify(unidades)); } catch (err) {}
          }
          Object.entries(d.estados).forEach(([uid, est]) => {
            const clean = normalizarEstado(est);
            estadosParaNuvem[uid] = clean;
            try { localStorage.setItem(STORAGE_PREFIX + uid, JSON.stringify(clean)); } catch (err) {}
          });
          if (d.unidadeAtiva && unidades.some(u => u.id === d.unidadeAtiva)) {
            unidadeAtual = d.unidadeAtiva;
            try { localStorage.setItem(STORAGE_ACTIVE_UNIT, unidadeAtual); } catch (err) {}
          }
          renderSelectUnidades();
          aplicarEstado(estadosParaNuvem[unidadeAtual] || estadoInicialUnidade(unidadeAtual));
          ultimoPayloadSalvo = JSON.stringify(snapshotEstado());
          render();
        } else {
          const clean = normalizarEstado(d);
          estadosParaNuvem[unidadeAtual] = clean;
          try { localStorage.setItem(STORAGE_PREFIX + unidadeAtual, JSON.stringify(clean)); } catch (err) {}
          aplicarEstado(clean);
          ultimoPayloadSalvo = JSON.stringify(snapshotEstado());
          render();
        }

        if (inputEl) inputEl.value = '';

        // 3) BLOCO SEPARADO PARA SINCRONIZAÇÃO COM O FIREBASE FIRESTORE
        if (!FIREBASE_ATIVO) {
          toast('Backup JSON importado com sucesso (modo local).', 'ok');
          return;
        }

        try {
          atualizarSeloSync('syncing');
          if (ehMulti) {
            await db.collection(FIRESTORE_COLECAO).doc('_meta').set({
              unidades: JSON.parse(JSON.stringify(unidades.map(u => ({ id: u.id, nome: u.nome })))),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
          }

          const entries = Object.entries(estadosParaNuvem);
          for (const [uid, clean] of entries) {
            const dadosSemUndefined = JSON.parse(JSON.stringify(clean));
            await db.collection(FIRESTORE_COLECAO).doc(uid).set({
              unidade: uid,
              dados: dadosSemUndefined,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
          }

          atualizarSeloSync('online');
          toast('Backup JSON importado e sincronizado com o Firebase!', 'ok');
        } catch (err) {
          console.error('Erro ao gravar backup no Firebase:', err);
          const codigo = (err && (err.code || err.message)) ? (err.code || err.message) : 'erro-desconhecido';
          if (err && err.code === 'permission-denied') {
            atualizarSeloSync('permission');
          } else {
            atualizarSeloSync('error');
          }
          toast('Backup carregado na tela, mas o Firebase bloqueou a gravação (' + codigo + '). Verifique a aba Regras no Firestore.', 'err');
        }
      };

      reader.onerror = () => {
        toast('Não foi possível ler o arquivo selecionado.', 'err');
        if (inputEl) inputEl.value = '';
      };

      reader.readAsText(file);
    }

    /* =========================================================================
     * MODAIS E TOASTS (SEM ALERT/CONFIRM)
     * ========================================================================= */
    function abrirModal(titulo, bodyHtml, actionsHtml) {
      document.getElementById('modal-title').textContent = titulo;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-actions').innerHTML = actionsHtml;
      const b = document.getElementById('modal-backdrop');
      b.classList.remove('hidden');
      b.classList.add('flex');
    }

    function fecharModal() {
      const b = document.getElementById('modal-backdrop');
      b.classList.add('hidden');
      b.classList.remove('flex');
    }

    function abrirModalUnidade() {
      abrirModal(
        'Nova unidade operativa',
        `<div class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Sigla / Código curto</label>
            <input id="nova-u-id" type="text" placeholder="Ex.: itacoatiara" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Nome de exibição</label>
            <input id="nova-u-nome" type="text" placeholder="Ex.: CEP Itacoatiara" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm" />
          </div>
        </div>`,
        `<button type="button" onclick="fecharModal()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-medium">Cancelar</button>

      setTimeout(() => document.getElementById('nova-u-id')?.focus(), 50);

    function criarUnidade() {
      const rawId = (document.getElementById('nova-u-id')?.value || '').trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-');
      const nome = (document.getElementById('nova-u-nome')?.value || '').trim();
      if (!rawId || !nome) {
        toast('Informe a sigla e o nome da unidade.', 'err');
        return;
      }
      if (unidades.some(u => u.id === rawId)) {
        toast('Já existe uma unidade com essa sigla.', 'err');
        return;
      }
      unidades.push({ id: rawId, nome });
      salvarListaUnidades();
      renderSelectUnidades();
      fecharModal();
      trocarUnidade(rawId);
      save();
      toast(`Unidade "${nome}" criada.`, 'ok');
    }

    function confirmarResetar() {
      const uNome = unidades.find(u => u.id === unidadeAtual)?.nome || unidadeAtual;
      abrirModal(
        'Restaurar dados iniciais',
        `<p>Deseja restaurar os dados iniciais da unidade <b>${esc(uNome)}</b>? As alterações não exportadas desta unidade serão substituídas.</p>`,
        `<button type="button" onclick="fecharModal()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-xs font-medium">Cancelar</button>
         <button type="button" onclick="executarReset()" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Restaurar</button>`
      );
    }

    function executarReset() {
      fecharModal();
      aplicarEstado(estadoInicialUnidade(unidadeAtual));
      save();
      render();
      toast('Dados iniciais restaurados para esta unidade.', 'info');
    }

    function toast(msg, tipo = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const estilos = {
        ok: 'bg-emerald-600 text-white',
        err: 'bg-rose-600 text-white',
        info: 'bg-slate-900 dark:bg-slate-800 text-white border border-slate-700'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium transition-opacity duration-300 ${estilos[tipo] || estilos.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 4500);
    }

    /* =========================================================================
     * MUTAÇÕES DE TURMAS, AMBIENTES E DOCENTES
     * ========================================================================= */
    function upd(id, campo, valor) {
      const t = turmas.find(x => x.id === id);
      if (!t) return;
      let novo;
      if (campo === 'sig') novo = Number(valor) || 0;
      else if (campo === 'real') novo = valor === '' ? null : Number(valor);
      else if (campo === 'sala') novo = valor || null;
      else novo = valor;
      if (novo === t[campo]) return;
      registrar(t, campo, t[campo], novo, 'manual');
      t[campo] = novo;
      if (campo === 'dias' && novo === 'sab') temSabado = true;
      save();
      render();
    }

    function updAmb(id, campo, valor) {
      const a = AMB.find(x => x.id === id);
      if (!a) return;
      if (campo === 'cap') a.cap = Number(valor) || 0;
      else if (campo === 'externa') a.externa = (valor === true || valor === 'true' || valor === 'externa');
      else a[campo] = String(valor || '').trim() || a[campo];
      save();
      render();
    }

    function delAmb(id) {
      if (turmas.some(t => t.sala === id)) return;
      AMB = AMB.filter(a => a.id !== id);
      save();
      render();
    }

    function addAmb() {
      const n = (document.getElementById('an')?.value || '').trim();
      if (!n) return;
      const tipo = document.getElementById('at')?.value || 'Sala';
      const cap = Number(document.getElementById('ac')?.value) || 0;
      const externa = document.getElementById('ae')?.value === 'externa';
      AMB.push({ id: 'a' + Date.now(), nome: n, tipo, cap, externa });
      save();
      render();
      toast(`Ambiente "${n}" adicionado.`, 'ok');
    }

    function addDoc() {
      const v = (document.getElementById('dn')?.value || '').trim();
      if (!v) return;
      if (docentes.some(d => norm(d) === norm(v))) {
        toast('Este docente já está cadastrado.', 'err');
        return;
      }
      docentes.push(v);
      save();
      render();
      toast(`Docente "${v}" cadastrado.`, 'ok');
    }

    function iniciarEdicaoDoc(i) {
      docEditIdx = i;
      render();
      setTimeout(() => {
        const inp = document.getElementById('doc-edit-' + i);
        if (inp) {
          inp.focus();
          inp.select();
        }
      }, 20);
    }

    function cancelarEdicaoDoc() {
      docEditIdx = null;
      render();
    }

    function salvarEdicaoDoc(i) {
      const inp = document.getElementById('doc-edit-' + i);
      const novo = (inp?.value || '').trim();
      const antigo = docentes[i];
      if (!novo) {
        toast('O nome do docente não pode ficar vazio.', 'err');
        return;
      }
      if (docentes.some((d, idx) => idx !== i && norm(d) === norm(novo))) {
        toast('Já existe outro docente com esse nome.', 'err');
        return;
      }
      if (novo !== antigo) {
        docentes[i] = novo;
        turmas.forEach(t => {
          if (t.doc === antigo) {
            registrar(t, 'doc', antigo, novo, 'manual');
            t.doc = novo;
          }
        });
        save();
        toast(`Docente atualizado para "${novo}".`, 'ok');
      }
      docEditIdx = null;
      render();
    }

    function delDoc(i) {
      docentes.splice(i, 1);
      if (docEditIdx === i) docEditIdx = null;
      save();
      render();
    }

    function ocultar(id) {
      const motivo = document.getElementById('mot-' + id)?.value || 'Outro';
      const t = turmas.find(x => x.id === id);
      if (!t) return;
      t.oculta = motivo;
      registrar(t, 'oculta', null, motivo, 'manual');
      save();
      render();
    }

    function restaurar(id) {
      const t = turmas.find(x => x.id === id);
      if (!t) return;
      registrar(t, 'oculta', t.oculta, null, 'manual');
      t.oculta = null;
      save();
      render();
    }

    /* =========================================================================
     * IMPORTAÇÃO DE RELATÓRIO SIG (.XLSX)
     * ========================================================================= */
    function diasDesdeImport() {
      if (!importacoes.length) return null;
      return Math.floor((Date.now() - new Date(importacoes[0].iso)) / 86400000);
    }

    function montarPrevia(rows, arquivo) {
      const hi = rows.findIndex(r => r && r[0] === 'Cód. da turma');
      if (hi < 0) return { erro: 'Não encontrei a coluna "Cód. da turma". Confirme se o arquivo é o Relatório de Acompanhamento de Matrícula.' };
      const lidas = [], erros = [];
      let totalEP = 0;
      rows.slice(hi + 1).forEach(r => {
        if (!r || !r[0] || r[10] !== 'Em processo') return;
        totalEP++;
        const freqTxt = String(r[9] || '');
        const hor = freqTxt.match(/(\d{1,2}:\d{2}).*?(\d{1,2}:\d{2})/);
        if (!hor) {
          erros.push(`${r[0]} · ${r[1]}: horário não reconhecido (${freqTxt || 'vazio'})`);
          return;
        }
        const ehSab = /\bs[aá]b/i.test(freqTxt);
        lidas.push({
          id: String(r[0]).trim(),
          nome: String(r[1] || '').trim(),
          ch: Number(r[4]) || 0,
          periodo: `${r[6]} a ${r[7]}`,
          ini: hor[1].padStart(5, '0'),
          fim: hor[2].padStart(5, '0'),
          dias: ehSab ? 'sab' : 'sem',
          sig: Number(r[14]) || 0
        });
      });
      if (!lidas.length && !erros.length) return { erro: 'Nenhuma turma "Em processo" encontrada neste arquivo.' };
      const idsRel = new Set(lidas.map(x => x.id));
      const novas = [], alteradas = [], ocultas = [];
      lidas.forEach(n => {
        const t = turmas.find(x => x.id === n.id);
        if (!t) { novas.push(n); return; }
        if (t.oculta) { ocultas.push(n); return; }
        const mud = CAMPOS_REL
          .filter(([c]) => String(t[c]) !== String(n[c]))
          .map(([c, l]) => ({ campo: l, chave: c, de: t[c], para: n[c] }));
        if (mud.length || t.saiu) alteradas.push({ t, n, mud });
      });
      const saiu = turmas.filter(t => !t.oculta && !t.saiu && !idsRel.has(t.id));
      return { arquivo, lidas: lidas.length, totalEP, novas, alteradas, ocultas, saiu, erros, dados: lidas };
    }

    function lerArquivo(file) {
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        preview = { erro: 'A biblioteca de leitura Excel ainda está carregando. Tente novamente em 2 segundos.' };
        render();
        return;
      }
      const r = new FileReader();
      r.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
          preview = montarPrevia(rows, file.name);
        } catch (err) {
          preview = { erro: 'Não foi possível ler este arquivo. Use o relatório em .xlsx.' };
        }
        render();
      };
      r.readAsArrayBuffer(file);
    }

    function confirmarImportacao() {
      const p = preview;
      if (!p || p.erro) return;
      p.novas.forEach(n => {
        if (n.dias === 'sab') temSabado = true;
        const t = { ...n, seg: '—', real: null, sala: null, doc: '', mod: '', origem: 'relatorio', oculta: null, saiu: null };
        turmas.push(t);
        registrar(t, 'Turma criada', null, 'importação', 'importação');
      });
      p.alteradas.forEach(({ t, n, mud }) => {
        mud.forEach(m => {
          registrar(t, m.chave, m.de, m.para, 'importação');
          t[m.chave] = n[m.chave];
        });
        if (t.saiu) {
          registrar(t, 'saiu', t.saiu, null, 'importação');
          t.saiu = null;
        }
      });
      p.saiu.forEach(t => {
        t.saiu = hojeTxt();
        registrar(t, 'saiu', null, 'saiu do relatório', 'importação');
      });
      importacoes.unshift({
        quando: agoraTxt(),
        iso: agoraIso(),
        arquivo: p.arquivo,
        lidas: p.lidas,
        novas: p.novas.length,
        alteradas: p.alteradas.length,
        saiu: p.saiu.length,
        ocultas: p.ocultas.length,
        erros: p.erros.length
      });
      preview = null;
      save();
      render();
      toast('Importação do SIG confirmada.', 'ok');
    }

    function cancelarImportacao() {
      preview = null;
      render();
    }

          <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700"><div class="text-[11px] text-slate-500">Novas</div><div class="text-lg font-bold">${p.novas.length}</div></div>
          <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700"><div class="text-[11px] text-slate-500">Alteradas</div><div class="text-lg font-bold">${p.alteradas.length}</div></div>
          <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700"><div class="text-[11px] text-slate-500">Saíram</div><div class="text-lg font-bold">${p.saiu.length}</div></div>
          <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700"><div class="text-[11px] text-slate-500">Ocultas</div><div class="text-lg font-bold">${p.ocultas.length}</div></div>
        </div>

        ${tab(['Código', 'Turma', 'Horário', 'SIG'], p.novas.map(n => `<tr class="border-b border-slate-100 dark:border-slate-800"><td class="py-1.5 px-2 text-slate-500">${n.id}</td><td class="py-1.5 px-2">${esc(n.nome)}</td><td class="py-1.5 px-2">${n.ini}–${n.fim}</td><td class="py-1.5 px-2">${n.sig}</td></tr>`))}

        ${p.erros.length ? `<h3 class="text-xs font-bold mb-1">Linhas ignoradas (${p.erros.length})</h3><ul class="list-disc pl-5 text-xs text-slate-500 mb-3">${p.erros.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
        <div class="flex gap-2 mt-3">

    /* =========================================================================
     * GRÁFICOS SVG (RELATÓRIOS)
     * ========================================================================= */
    function legendaChart(series) {
      return `<div class="flex gap-4 text-xs text-slate-500 mb-2">${series.map(s => `<span class="inline-flex items-center gap-1.5"><i class="inline-block w-2.5 h-2.5 rounded-xs" style="background:${s.cor}"></i>${s.nome}</span>`).join('')}</div>`;
    }

    function colChart(labels, series) {
      const W = 640, H = 260, pl = 44, pr = 10, pt = 20, pb = 38;
      const max = Math.max(1, ...series.flatMap(s => s.values.map(v => v || 0))) * 1.15;
      const iw = W - pl - pr, ih = H - pt - pb;
      const gw = iw / labels.length;
      const bw = Math.min(42, gw * 0.32);
      const n = series.length;
      let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto text-[11px] fill-slate-500 dark:fill-slate-400">`;
      for (let k = 0; k <= 4; k++) {
        const v = Math.round(max / 1.15 * k / 4);
        const y = pt + ih - (v / (max / 1.15)) * ih / 1.15;
        svg += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity="0.15"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${v}</text>`;
      }
      labels.forEach((lab, i) => {
        const cx = pl + i * gw + gw / 2;
        series.forEach((s, j) => {
          const v = s.values[i];
          const x = cx + (j - (n - 1) / 2) * (bw + 6) - bw / 2;
          if (v == null) {
            svg += `<text x="${x + bw / 2}" y="${pt + ih - 6}" text-anchor="middle">sem dado</text>`;
            return;
          }
          const h = v / max * ih;
          const y = pt + ih - h;
          svg += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${s.cor}"/>`;
          svg += `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" class="fill-slate-800 dark:fill-slate-200 font-semibold">${v}</text>`;
        });
        svg += `<text x="${cx}" y="${H - 14}" text-anchor="middle" class="fill-slate-700 dark:fill-slate-300 font-medium">${esc(lab)}</text>`;
      });
      svg += `<line x1="${pl}" x2="${W - pr}" y1="${pt + ih}" y2="${pt + ih}" stroke="currentColor" stroke-opacity="0.25"/></svg>`;
      return legendaChart(series) + svg;
    }

    const CORES_MOD = ['#0b5cad', '#12b76a', '#f5a524', '#94a3b8'];
    function donutChart(items) {
      const total = items.reduce((s, i) => s + i.valor, 0);
      const R = 70, C = 2 * Math.PI * R;
      let off = 0;
      let svg = '<svg viewBox="0 0 200 200" class="w-44 h-44 shrink-0">';
      svg += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="currentColor" stroke-opacity="0.12" stroke-width="26"/>`;
      items.forEach(i => {
        if (!i.valor) return;
        const len = i.valor / (total || 1) * C;
        svg += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${i.cor}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;
        off += len;
      });
      svg += `<text x="100" y="98" text-anchor="middle" class="fill-slate-900 dark:fill-slate-100 text-[22px] font-bold">${total}</text>`;
      svg += `<text x="100" y="116" text-anchor="middle" class="fill-slate-500 text-[11px]">alunos SIG</text></svg>`;
      const leg = items.map(i => `<div class="flex items-center gap-2.5 my-2 text-sm"><i class="w-3 h-3 rounded-xs inline-block shrink-0" style="background:${i.cor}"></i><span class="min-w-[110px]">${esc(i.nome)}</span><b class="tabular-nums">${i.valor}</b><span class="text-xs text-slate-500">alunos · ${i.turmas} turma(s)</span></div>`).join('');
      return `<div class="flex items-center gap-7 flex-wrap">${svg}<div>${leg}</div></div>`;
    }

    /* =========================================================================
     * FILTROS DE BUSCA (SEM PERDER O FOCO AO DIGITAR)
     * ========================================================================= */
    function setMapaBusca(v) {
      mapaBusca = v;
      renderMapaGrade();
    }
    function setMapaFiltro(f) {
      mapaFiltro = f;
      render();
    }
    function setMapaEscopo(escopo) {
      mapaEscopo = escopo;
      render();
    }
    function setTurmasBusca(v) {
      turmasBusca = v;
      renderTurmasTabela();
    }
    function setTurmasFiltro(f) {
      turmasFiltro = f;
      render();
    }

    function filtrarTurmasMapa(lista) {
      const q = norm(mapaBusca.trim());
      return lista.filter(t => {
        if (mapaFiltro === 'conflito' && !conflitos(t).length) return false;
        if (mapaFiltro === 'sem_docente' && t.doc) return false;
        if (mapaFiltro === 'encerrando' && !semaforo(t).encerrando) return false;
        if (!q) return true;
        const alvo = norm(`${t.id} ${t.nome} ${t.doc} ${ambNome(t.sala)} ${t.seg}`);
        return alvo.includes(q);
      });
    }

    function filtrarTurmasLista(lista) {
      const q = norm(turmasBusca.trim());
      return lista.filter(t => {
        if (turmasFiltro === 'pendencia' && !pendencias(t).length) return false;
        if (turmasFiltro === 'conflito' && !conflitos(t).length) return false;
        if (turmasFiltro === 'sem_docente' && t.doc) return false;
        if (!q) return true;
        const alvo = norm(`${t.id} ${t.nome} ${t.seg} ${t.doc} ${ambNome(t.sala)} ${t.mod}`);
        return alvo.includes(q);
      });
    }

    /* =========================================================================
     * RENDERIZAÇÃO DAS ABAS
     * ========================================================================= */
    function nav() {
      document.getElementById('nav').innerHTML = Object.entries(TABS)
        .map(([k, v]) => `<button type="button" onclick="aba='${k}';render()" class="px-3.5 py-2.5 text-sm whitespace-nowrap border-b-2 transition ${k === aba ? 'border-senac-600 text-senac-600 dark:text-sky-400 dark:border-sky-400 font-semibold' : 'border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'}">${v}</button>`)
        .join('');
    }

    function renderMapaGrade() {
      const box = document.getElementById('mapa-grade-box');
      if (!box) return;
      const ehExterna = mapaEscopo === 'externa';
      const ambEscopo = AMB.filter(a => Boolean(a.externa) === ehExterna);
      const idsAmb = new Set(ambEscopo.map(a => a.id));
      const turmasEscopo = ativas().filter(t => t.sala && idsAmb.has(t.sala));
      const T = filtrarTurmasMapa(turmasEscopo);
      const turnos = turnosVisiveisMapa();

      // Quantitativo geral dinâmico (real/SIG) das turmas exibidas
      const totalSig = T.reduce((s, t) => s + (Number(t.sig) || 0), 0);
      const comReal = T.filter(t => t.real !== null && t.real !== undefined && t.real !== '');
      const totalReal = comReal.reduce((s, t) => s + Number(t.real), 0);
      const resumoRealSig = comReal.length ? `${totalReal}/${totalSig}` : `—/${totalSig}`;

      let h = '';
      if (!ambEscopo.length) {
        h += `<div class="py-10 text-center text-sm text-slate-500">Nenhum ambiente cadastrado como <b>${ehExterna ? 'Externa' : 'Na unidade'}</b>. Cadastre ou altere na aba <b>Ambientes</b>.</div>`;
      } else {
        h += `<div class="overflow-x-auto"><table class="grade w-full border-collapse min-w-[780px]"><thead><tr class="border-b border-slate-200 dark:border-slate-800">`;
        h += `<th class="tn bg-slate-50 dark:bg-slate-900 text-left text-xs font-semibold text-slate-500 px-3 py-2.5 w-[96px]">Turno</th>`;
        h += ambEscopo.map(a => `<th class="text-center px-2 py-2.5 min-w-[185px] align-bottom"><div class="text-xs font-bold text-slate-800 dark:text-slate-100">${esc(a.nome)}</div><div class="text-[11px] font-normal text-slate-500">${esc(a.tipo)} · ${a.cap} lug.</div></th>`).join('');
        h += `</tr></thead><tbody>`;

        turnos.forEach(tn => {
          h += `<tr class="border-b border-slate-200 dark:border-slate-800"><td class="tn bg-slate-50 dark:bg-slate-900 text-xs font-bold text-slate-700 dark:text-slate-200 px-3 py-3 align-top">${tn}</td>`;
          h += ambEscopo.map(a => {
            const ts = T.filter(t => t.sala === a.id && turnosDaTurma(t).includes(tn))
              .sort((x, y) => hm(x.ini) - hm(y.ini));
            return `<td class="p-1.5 align-top">${ts.map(t => {
              const c = conflitos(t).length > 0;
              const s = semaforo(t);
              const ehCont = turnosDaTurma(t)[0] !== tn;
              const realTxt = (t.real !== null && t.real !== undefined && t.real !== '') ? t.real : '—';
              return `<div class="ev rounded-lg p-2.5 mb-1.5 text-white text-xs leading-snug flex flex-col gap-0.5 min-h-[116px] ${c ? 'bg-rose-700 dark:bg-rose-800' : 'bg-senac-600 dark:bg-senac-700'}">
                <span class="sem ${s.cls}" data-tip="${esc(s.txt)}"></span>
                <div class="flex items-center justify-between gap-1">
                  <span class="text-[10px] opacity-80 font-medium">${esc(t.id)}</span>
                  ${ehCont ? '<span class="text-[9px] uppercase tracking-wider bg-white/20 px-1.5 py-0.5 rounded">cont.</span>' : ''}
                </div>
                <div class="font-bold text-[12.5px] line-clamp-2">${esc(t.nome)}</div>
                <div class="text-[11px] opacity-90" title="Alunos real / Alunos SIG">${t.ini}–${t.fim} · <b>${realTxt}/${t.sig}</b> alunos</div>
                <div class="text-[10.5px] opacity-80">${esc(t.periodo)}</div>
                <div class="text-[11px] opacity-90 truncate pr-4">${t.doc ? esc(t.doc) : 'sem docente'}</div>
              </div>`;

                        ? `<button type="button" onclick="salvarEdicaoDoc(${i})" class="text-xs px-2.5 py-1 rounded-lg bg-senac-600 text-white font-medium mr-1">Salvar</button>
                           <button type="button" onclick="cancelarEdicaoDoc()" class="text-xs px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-700">Cancelar</button>`
                        : `<button type="button" onclick="iniciarEdicaoDoc(${i})" title="Editar nome do docente" class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 mr-1">
                             <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                             Editar
                           </button>
                           <button type="button" onclick="delDoc(${i})" class="text-xs px-2.5 py-1 rounded-lg border border-rose-200 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/40">Remover</button>`}
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
          <div class="flex flex-wrap items-center gap-2 mt-4 pt-3 border-t border-slate-200 dark:border-slate-800">
            <input id="dn" type="text" placeholder="Nome completo do docente" onkeydown="if(event.key==='Enter')addDoc();" class="text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 min-w-[240px]" />
            <button type="button" onclick="addDoc()" class="text-xs font-semibold px-3.5 py-2 rounded-lg bg-senac-600 hover:bg-senac-700 text-white">Adicionar docente</button>
          </div>
        </div>`;
      },

      rel() {
        const T = ativas();
        const somaSig = ts => ts.reduce((s, t) => s + (Number(t.sig) || 0), 0);
        const comReal = ts => ts.filter(t => t.real !== null && t.real !== undefined && t.real !== '');
        const somaReal = ts => comReal(ts).reduce((s, t) => s + Number(t.real), 0);
        const ch = T.reduce((s, t) => s + (Number(t.ch) || 0), 0);
        const turnosRel = turnosVisiveisMapa();

        const mods = [...MODS, 'Não definida'];
        const outros = T.filter(t => t.mod && !MODS.includes(t.mod));
        const modItems = mods.map((m, i) => ({
          nome: m,
          valor: somaSig(T.filter(t => modLabel(t) === m)),
          turmas: T.filter(t => modLabel(t) === m).length,
          cor: CORES_MOD[i]
        }));
        if (outros.length) {
          modItems.push({ nome: 'Outras (antigas)', valor: somaSig(outros), turmas: outros.length, cor: '#64748b' });
        }

        return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
          ${[
            ['Turmas ativas', T.length],
            ['Alunos SIG', somaSig(T)],
            ['Alunos real informados', `${somaReal(T)} (${comReal(T).length}/${T.length})`],
            ['Carga horária total', ch.toLocaleString('pt-BR') + 'h']
          ].map(([l, v]) => `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4"><div class="text-xs text-slate-500">${l}</div><div class="text-xl font-bold mt-1 tabular-nums">${v}</div></div>`).join('')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
            <h2 class="text-sm font-bold mb-1">Alunos por turno: SIG × Real</h2>
            <p class="text-xs text-slate-500 mb-3">Real soma apenas as turmas com dado informado.</p>
            ${colChart(turnosRel, [
              { nome: 'SIG', cor: '#0b5cad', values: turnosRel.map(tn => somaSig(T.filter(t => turnoPrincipal(t) === tn))) },
              { nome: 'Real', cor: '#12b76a', values: turnosRel.map(tn => { const ts = T.filter(t => turnoPrincipal(t) === tn); return comReal(ts).length ? somaReal(ts) : null; }) }
            ])}
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
            <h2 class="text-sm font-bold mb-1">Unidade por modalidade</h2>
            <p class="text-xs text-slate-500 mb-3">Alunos previstos no SIG por modalidade (PSG, Mista, Comercial).</p>
            ${donutChart(modItems)}
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
          <h2 class="text-sm font-bold mb-1">Alunos por turma: SIG × Real</h2>
          <p class="text-xs text-slate-500 mb-3">Presença = real ÷ SIG.</p>
          <div class="overflow-x-auto">
            <table class="w-full text-xs border-collapse min-w-[640px]">
              <thead><tr class="border-b border-slate-200 dark:border-slate-800 text-slate-500"><th class="text-left py-2 px-2">Código</th><th class="text-left py-2 px-2">Curso</th><th class="text-left py-2 px-2">Turno</th><th class="text-right py-2 px-2">SIG</th><th class="text-right py-2 px-2">Real</th><th class="text-right py-2 px-2">Diferença</th><th class="text-left py-2 px-2">Presença</th></tr></thead>
              <tbody>
                ${T.map(t => {
                  if (t.real === null || t.real === undefined || t.real === '') {
                    return `<tr class="border-b border-slate-100 dark:border-slate-800"><td class="py-2 px-2 text-slate-400">${esc(t.id)}</td><td class="py-2 px-2 font-medium">${esc(t.nome)}</td><td class="py-2 px-2">${turnoPrincipal(t)}</td><td class="py-2 px-2 text-right tabular-nums">${t.sig}</td><td class="py-2 px-2 text-right"><span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">pendente</span></td><td class="py-2 px-2 text-right">—</td><td class="py-2 px-2 text-slate-400">real não informado</td></tr>`;
                  }
                  const p = Math.round(t.real / (t.sig || 1) * 100);
                  const d = t.real - t.sig;
                  return `<tr class="border-b border-slate-100 dark:border-slate-800"><td class="py-2 px-2 text-slate-400">${esc(t.id)}</td><td class="py-2 px-2 font-medium">${esc(t.nome)}</td><td class="py-2 px-2">${turnoPrincipal(t)}</td><td class="py-2 px-2 text-right tabular-nums">${t.sig}</td><td class="py-2 px-2 text-right tabular-nums">${t.real}</td><td class="py-2 px-2 text-right tabular-nums">${d > 0 ? '+' : ''}${d}</td><td class="py-2 px-2"><div class="w-28 h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width:${Math.min(p, 100)}%"></div></div><span class="text-[11px] text-slate-500">${p}%</span></td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
      },

      hist() {
        return `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 mb-4">
          <h2 class="text-sm font-bold mb-1">Importações do SIG</h2>
          <p class="text-xs text-slate-500 mb-3">Histórico de arquivos .xlsx processados nesta unidade.</p>
          ${importacoes.length
            ? `<div class="overflow-x-auto"><table class="w-full text-xs border-collapse"><thead><tr class="border-b border-slate-200 dark:border-slate-800 text-slate-500"><th class="text-left py-2 px-2">Quando</th><th class="text-left py-2 px-2">Arquivo</th><th class="text-right py-2 px-2">Lidas</th><th class="text-right py-2 px-2">Novas</th><th class="text-right py-2 px-2">Alteradas</th><th class="text-right py-2 px-2">Saíram</th><th class="text-right py-2 px-2">Ocultas</th></tr></thead><tbody>${importacoes.map(i => `<tr class="border-b border-slate-100 dark:border-slate-800"><td class="py-2 px-2 whitespace-nowrap">${esc(i.quando)}</td><td class="py-2 px-2">${esc(i.arquivo)}</td><td class="py-2 px-2 text-right tabular-nums">${i.lidas}</td><td class="py-2 px-2 text-right tabular-nums">${i.novas}</td><td class="py-2 px-2 text-right tabular-nums">${i.alteradas}</td><td class="py-2 px-2 text-right tabular-nums">${i.saiu}</td><td class="py-2 px-2 text-right tabular-nums">${i.ocultas}</td></tr>`).join('')}</tbody></table></div>`
            : '<p class="text-xs text-slate-400">Nenhuma importação registrada ainda.</p>'}
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
          <h2 class="text-sm font-bold mb-1">Alterações por turma</h2>
          <p class="text-xs text-slate-500 mb-3">Mostra as 200 alterações mais recentes (manuais e de importação).</p>
          ${historico.length
            ? `<div class="overflow-x-auto"><table class="w-full text-xs border-collapse min-w-[640px]"><thead><tr class="border-b border-slate-200 dark:border-slate-800 text-slate-500"><th class="text-left py-2 px-2">Quando</th><th class="text-left py-2 px-2">Turma</th><th class="text-left py-2 px-2">Campo</th><th class="text-left py-2 px-2">De</th><th class="text-left py-2 px-2">Para</th><th class="text-left py-2 px-2">Origem</th></tr></thead><tbody>${historico.slice(0, 200).map(x => `<tr class="border-b border-slate-100 dark:border-slate-800"><td class="py-2 px-2 whitespace-nowrap text-slate-500">${esc(x.quando)}</td><td class="py-2 px-2 font-medium">${esc(x.nome)} <span class="text-slate-400 font-normal">${esc(x.turma)}</span></td><td class="py-2 px-2">${ROT[x.campo] || esc(x.campo)}</td><td class="py-2 px-2 text-slate-500">${esc(fmtV(x.campo, x.de))}</td><td class="py-2 px-2 font-medium">${esc(fmtV(x.campo, x.para))}</td><td class="py-2 px-2"><span class="px-2 py-0.5 rounded-full text-[10.5px] ${x.origem === 'manual' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${esc(x.origem)}</span></td></tr>`).join('')}</tbody></table></div>`
            : '<p class="text-xs text-slate-400">Nenhuma alteração registrada ainda.</p>'}
        </div>`;
      }
    };

    function render() {
      nav();
      document.getElementById('app').innerHTML = VIEWS[aba]();
      if (aba === 'mapa') renderMapaGrade();
      if (aba === 'turmas') renderTurmasTabela();
      const fd = document.getElementById('footer-date');
      if (fd) fd.textContent = `Referência: ${hojeTxt()}`;
    }

    // Inicialização
    carregarListaUnidades();
    loadUnidade(unidadeAtual);
  </script>
</body>
</html>
